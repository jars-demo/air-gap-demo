<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parrot</title>
    <link rel="stylesheet" href="https://fonts.parrot-cdn.example/css2?family=Pirata+One" />
    <link rel="stylesheet" href="/static/parrot.css" />
    <script src="https://cdn.parrot-cdn.example/confetti@1.9.3/confetti.min.js" defer></script>
    <script src="/static/parrot.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Parrot</h1>
      <p class="lead">The island's notice board.</p>
      <blockquote id="says">...</blockquote>
      <div class="moods">
        <button data-mood="happy">Happy</button>
        <button data-mood="grumpy">Grumpy</button>
        <button data-mood="sleepy">Sleepy</button>
        <button data-mood="seasick">Seasick</button>
      </div>
    </main>
  </body>
</html>
